<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f08a8a"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 2; }
    .in { fill: #8b8bf0; stroke: #6d6de0; }
    .dec { fill: #dcdcf8; stroke: #1f2937; stroke-width: 3; }
    .mask { fill: #fde9cf; stroke: #f0b870; }
    .syn { fill: #cfe8e4; stroke: #7fbfb6; }
    .io { fill: #e5e7eb; stroke: #c4c7cc; }
    .loss { fill: #fecaca; stroke: #f08a8a; }
    .lbl { fill: #1f2937; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .lblw { fill: #ffffff; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .wire { stroke: #9ca3af; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    .wirel { stroke: #f08a8a; stroke-width: 2.5; fill: none; marker-end: url(#r); }
    .small { fill: #6b7280; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- loss -->
  <rect class="box loss" x="400" y="20" width="330" height="54" rx="8"/>
  <text class="lbl" x="565" y="47">Multi-scale spectrogram loss</text>
  <rect class="box io" x="40" y="20" width="110" height="54" rx="4"/>
  <text class="lbl" x="95" y="47">Recording</text>
  <rect class="box io" x="1020" y="20" width="110" height="54" rx="4"/>
  <text class="lbl" x="1075" y="47">Output</text>
  <path class="wirel" d="M150,47 L398,47"/>
  <path class="wirel" d="M1020,47 L732,47"/>

  <!-- inputs: the curves -->
  <rect class="box in" x="40" y="150" width="130" height="46" rx="20"/>
  <text class="lblw" x="105" y="173">Pitch</text>
  <rect class="box in" x="40" y="222" width="130" height="46" rx="20"/>
  <text class="lblw" x="105" y="245">Loudness</text>
  <rect class="box in" x="40" y="294" width="130" height="46" rx="20"/>
  <text class="lblw" x="105" y="317">Brightness α</text>
  <text class="small" x="105" y="360">measured on the recording,</text>
  <text class="small" x="105" y="378">from the score at synthesis</text>

  <!-- decoder -->
  <rect class="box dec" x="230" y="140" width="130" height="210" rx="8"/>
  <text class="lbl" x="295" y="245">Decoder</text>
  <path class="wire" d="M170,173 L228,190"/>
  <path class="wire" d="M170,245 L228,245"/>
  <path class="wire" d="M170,317 L228,300"/>

  <!-- decoder outputs -->
  <rect class="box in" x="420" y="110" width="150" height="46" rx="20"/>
  <text class="lblw" x="495" y="133">Amplitude</text>
  <rect class="box in" x="420" y="222" width="150" height="46" rx="20"/>
  <text class="lblw" x="495" y="245">Residuals</text>
  <rect class="box in" x="420" y="400" width="150" height="46" rx="20"/>
  <text class="lblw" x="495" y="423">Noise magnitudes</text>
  <path class="wire" d="M360,170 L418,135"/>
  <path class="wire" d="M360,245 L418,245"/>
  <path class="wire" d="M360,320 L418,418"/>

  <!-- masks -->
  <rect class="box mask" x="620" y="166" width="150" height="46" rx="4"/>
  <text class="lbl" x="695" y="189">Brightness mask</text>
  <rect class="box mask" x="620" y="222" width="150" height="46" rx="4"/>
  <text class="lbl" x="695" y="245">Residual mask</text>
  <rect class="box mask" x="620" y="278" width="150" height="46" rx="4"/>
  <text class="lbl" x="695" y="301">Bow mask, k = 0</text>
  <!-- alpha to the brightness mask -->
  <path class="wire" d="M170,317 C200,317 200,120 300,120 C400,120 560,120 560,189 L618,189" stroke-dasharray="6 5"/>
  <path class="wire" d="M570,245 L618,245"/>

  <!-- product and harmonic synth -->
  <circle cx="830" cy="245" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text class="lbl" x="830" y="246">×</text>
  <path class="wire" d="M770,189 L808,236"/>
  <path class="wire" d="M770,245 L808,245"/>
  <path class="wire" d="M770,301 L808,254"/>
  <rect class="box mask" x="770" y="330" width="120" height="46" rx="4"/>
  <text class="lbl" x="830" y="353">1/n</text>
  <path class="wire" d="M830,330 L830,267"/>
  <rect class="box syn" x="900" y="130" width="130" height="60" rx="4"/>
  <text class="lbl" x="965" y="160">Harmonic synth</text>
  <path class="wire" d="M830,225 L830,160 L898,160"/>
  <path class="wire" d="M570,133 L898,150"/>

  <!-- body filter, noise, sum, room -->
  <rect class="box syn" x="900" y="222" width="130" height="46" rx="4"/>
  <text class="lbl" x="965" y="245">Body filter</text>
  <path class="wire" d="M965,190 L965,220"/>
  <rect class="box syn" x="900" y="400" width="130" height="46" rx="4"/>
  <text class="lbl" x="965" y="423">Filtered noise</text>
  <path class="wire" d="M570,423 L898,423"/>
  <circle cx="1075" cy="330" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text class="lbl" x="1075" y="331">+</text>
  <path class="wire" d="M1030,245 L1075,245 L1075,308"/>
  <path class="wire" d="M1030,423 L1075,423 L1075,352"/>
  <rect class="box syn" x="1020" y="110" width="110" height="46" rx="4" stroke-dasharray="6 5"/>
  <text class="lbl" x="1075" y="133">Room reverb</text>
  <path class="wire" d="M1075,310 L1075,158" style="marker-end: none"/>
  <path class="wire" d="M1075,110 L1075,76"/>
  <text class="small" x="1075" y="180">+ room reverb variant</text>
</svg>
