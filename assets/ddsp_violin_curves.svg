<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 540" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f08a8a"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 2; }
    .in { fill: #8b8bf0; stroke: #6d6de0; }
    .dec { fill: #dcdcf8; stroke: #1f2937; stroke-width: 3; }
    .mask { fill: #fde9cf; stroke: #f0b870; }
    .syn { fill: #cfe8e4; stroke: #7fbfb6; }
    .io { fill: #e5e7eb; stroke: #c4c7cc; }
    .loss { fill: #fecaca; stroke: #f08a8a; }
    .lbl { fill: #1f2937; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .lblw { fill: #ffffff; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .wire { stroke: #9ca3af; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    .line { stroke: #9ca3af; stroke-width: 2.5; fill: none; }
    .wirel { stroke: #f08a8a; stroke-width: 2.5; fill: none; marker-end: url(#r); }
    .small { fill: #6b7280; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- loss row -->
  <rect class="box io" x="40" y="20" width="120" height="54" rx="4"/>
  <text class="lbl" x="100" y="47">Recording</text>
  <rect class="box loss" x="440" y="20" width="340" height="54" rx="8"/>
  <text class="lbl" x="610" y="47">Multi-scale spectrogram loss</text>
  <rect class="box io" x="1170" y="20" width="120" height="54" rx="4"/>
  <text class="lbl" x="1230" y="47">Output</text>
  <path class="wirel" d="M160,47 L438,47"/>
  <path class="wirel" d="M1170,47 L782,47"/>

  <!-- inputs: the curves -->
  <rect class="box in" x="40" y="147" width="150" height="46" rx="20"/>
  <text class="lblw" x="115" y="170">Brightness α</text>
  <rect class="box in" x="40" y="219" width="150" height="46" rx="20"/>
  <text class="lblw" x="115" y="242">Pitch</text>
  <rect class="box in" x="40" y="291" width="150" height="46" rx="20"/>
  <text class="lblw" x="115" y="314">Loudness</text>
  <text class="small" x="115" y="365">from the recording in training,</text>
  <text class="small" x="115" y="383">from the score at synthesis</text>

  <!-- decoder -->
  <rect class="box dec" x="250" y="137" width="130" height="210" rx="8"/>
  <text class="lbl" x="315" y="242">Decoder</text>
  <path class="wire" d="M190,170 L248,190"/>
  <path class="wire" d="M190,242 L248,242"/>
  <path class="wire" d="M190,314 L248,294"/>

  <!-- decoder outputs -->
  <rect class="box in" x="440" y="214" width="180" height="46" rx="20"/>
  <text class="lblw" x="530" y="237">Residuals</text>
  <rect class="box in" x="440" y="377" width="180" height="46" rx="20"/>
  <text class="lblw" x="530" y="400">Amplitude</text>
  <rect class="box in" x="440" y="447" width="180" height="46" rx="20"/>
  <text class="lblw" x="530" y="470">Noise magnitudes</text>
  <path class="wire" d="M380,237 L438,237"/>
  <path class="wire" d="M380,300 L438,392"/>
  <path class="wire" d="M380,330 L438,460"/>

  <!-- masks on the harmonic levels -->
  <rect class="box mask" x="680" y="160" width="190" height="46" rx="4"/>
  <text class="lbl" x="775" y="183">1/n tilt by α</text>
  <rect class="box mask" x="680" y="214" width="190" height="46" rx="4"/>
  <text class="lbl" x="775" y="237">Residual mask, ±6 dB</text>
  <rect class="box mask" x="680" y="268" width="190" height="46" rx="4"/>
  <text class="lbl" x="775" y="291">Bow mask, k = 0</text>
  <!-- the brightness curve goes straight to its mask -->
  <path class="wire" d="M115,147 L115,100 L775,100 L775,158" stroke-dasharray="6 5"/>
  <path class="wire" d="M620,237 L678,237"/>

  <!-- product -->
  <circle cx="920" cy="237" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text class="lbl" x="920" y="238">×</text>
  <path class="wire" d="M870,183 L901,228"/>
  <path class="wire" d="M870,237 L898,237"/>
  <path class="wire" d="M870,291 L901,246"/>
  <path class="wire" d="M620,400 L920,400 L920,259"/>

  <!-- synthesis -->
  <rect class="box syn" x="970" y="214" width="150" height="46" rx="4"/>
  <text class="lbl" x="1045" y="237">Harmonic synth</text>
  <path class="wire" d="M940,237 L968,237"/>
  <rect class="box syn" x="970" y="300" width="150" height="46" rx="4"/>
  <text class="lbl" x="1045" y="323">Body filter</text>
  <path class="wire" d="M1045,260 L1045,298"/>
  <rect class="box syn" x="970" y="447" width="150" height="46" rx="4"/>
  <text class="lbl" x="1045" y="470">Filtered noise</text>
  <path class="wire" d="M620,470 L968,470"/>

  <!-- sum, room reverb, output -->
  <circle cx="1230" cy="400" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text class="lbl" x="1230" y="401">+</text>
  <path class="wire" d="M1120,323 L1190,323 L1190,400 L1208,400"/>
  <path class="wire" d="M1120,470 L1230,470 L1230,422"/>
  <rect class="box syn" x="1165" y="214" width="130" height="46" rx="4" stroke-dasharray="6 5"/>
  <text class="lbl" x="1230" y="237">Room reverb</text>
  <text class="small" x="1230" y="282">+ room reverb variant</text>
  <path class="wire" d="M1230,380 L1230,262"/>
  <path class="wire" d="M1230,214 L1230,76"/>
</svg>
