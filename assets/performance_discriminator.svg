<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f08a8a"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 2; }
    .in { fill: #8b8bf0; stroke: #6d6de0; }
    .mod { fill: #dcdcf8; stroke: #1f2937; stroke-width: 3; }
    .disc { fill: #fef3c7; stroke: #1f2937; stroke-width: 3; }
    .io { fill: #e5e7eb; stroke: #c4c7cc; }
    .loss { fill: #fecaca; stroke: #f08a8a; }
    .lbl { fill: #1f2937; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .lblw { fill: #ffffff; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .wire { stroke: #9ca3af; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    .wirel { stroke: #f08a8a; stroke-width: 2.5; fill: none; marker-end: url(#r); }
    .small { fill: #6b7280; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .smallr { fill: #b91c1c; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- the measured and the written curves, read by the loss and by the discriminator -->
  <rect class="box io" x="30" y="20" width="160" height="130" rx="4"/>
  <text class="lbl" x="110" y="74">Curves</text>
  <text class="small" x="110" y="98">measured</text>
  <rect class="box io" x="1010" y="20" width="160" height="130" rx="4"/>
  <text class="lbl" x="1090" y="74">Curves</text>
  <text class="small" x="1090" y="98">written</text>

  <!-- L1 loss -->
  <rect class="box loss" x="410" y="20" width="380" height="54" rx="8"/>
  <text class="lbl" x="600" y="47">L1 loss</text>
  <path class="wirel" d="M190,47 L408,47"/>
  <path class="wirel" d="M1010,47 L792,47"/>

  <!-- discriminator -->
  <rect class="box disc" x="410" y="96" width="380" height="54" rx="8"/>
  <text class="lbl" x="600" y="114">Discriminator</text>
  <text class="small" x="600" y="136">measured or written, for these notes?</text>
  <path class="wire" d="M190,123 L407,123"/>
  <path class="wire" d="M1010,123 L793,123"/>

  <!-- its scores become losses for the curve model -->
  <path class="wirel" d="M680,152 L680,222 L365,222 L365,247" stroke-dasharray="6 5"/>
  <text class="smallr" x="522" y="207">adversarial and feature-matching losses</text>

  <!-- inputs -->
  <rect class="box in" x="30" y="262" width="190" height="46" rx="20"/>
  <text class="lblw" x="125" y="285">Notes</text>
  <rect class="box in" x="30" y="322" width="190" height="46" rx="20"/>
  <text class="lblw" x="125" y="345">Expression controls</text>

  <!-- the notes also go to the discriminator -->
  <path class="wire" d="M125,262 L125,186 L500,186 L500,153"/>

  <!-- curve model -->
  <rect class="box mod" x="290" y="250" width="150" height="130" rx="8"/>
  <text class="lbl" x="365" y="315">Curve model</text>
  <path class="wire" d="M220,285 L288,300"/>
  <path class="wire" d="M220,345 L288,330"/>

  <!-- its curves -->
  <path class="wire" d="M440,315 L1090,315 L1090,153"/>
  <text class="small" x="765" y="298">pitch, loudness, brightness</text>
</svg>
