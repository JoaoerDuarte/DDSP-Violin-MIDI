<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 440" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f08a8a"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 2; }
    .in { fill: #8b8bf0; stroke: #6d6de0; }
    .dec { fill: #dcdcf8; stroke: #1f2937; stroke-width: 3; }
    .disc { fill: #fef3c7; stroke: #1f2937; stroke-width: 3; }
    .syn { fill: #cfe8e4; stroke: #7fbfb6; }
    .io { fill: #e5e7eb; stroke: #c4c7cc; }
    .loss { fill: #fecaca; stroke: #f08a8a; }
    .lbl { fill: #1f2937; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .lblw { fill: #ffffff; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .wire { stroke: #9ca3af; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    .wirel { stroke: #f08a8a; stroke-width: 2.5; fill: none; marker-end: url(#r); }
    .small { fill: #6b7280; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .smallr { fill: #b91c1c; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- the recording and the output, read by the loss and by the discriminator -->
  <rect class="box io" x="40" y="20" width="120" height="130" rx="4"/>
  <text class="lbl" x="100" y="85">Recording</text>
  <rect class="box io" x="1170" y="20" width="120" height="130" rx="4"/>
  <text class="lbl" x="1230" y="85">Output</text>

  <!-- spectral loss -->
  <rect class="box loss" x="440" y="20" width="340" height="54" rx="8"/>
  <text class="lbl" x="610" y="47">Multi-scale spectrogram loss</text>
  <path class="wirel" d="M160,47 L438,47"/>
  <path class="wirel" d="M1170,47 L782,47"/>

  <!-- discriminator -->
  <rect class="box disc" x="440" y="96" width="340" height="54" rx="8"/>
  <text class="lbl" x="610" y="114">Discriminator</text>
  <text class="small" x="610" y="136">three spectrograms: recording or output?</text>
  <path class="wire" d="M160,123 L437,123"/>
  <path class="wire" d="M1170,123 L783,123"/>

  <!-- its scores become losses for the decoder -->
  <path class="wirel" d="M610,152 L610,205 L315,205 L315,244" stroke-dasharray="6 5"/>
  <text class="smallr" x="462" y="190">adversarial and feature-matching losses</text>

  <!-- inputs: the curves -->
  <rect class="box in" x="40" y="257" width="150" height="46" rx="20"/>
  <text class="lblw" x="115" y="280">Brightness α</text>
  <rect class="box in" x="40" y="307" width="150" height="46" rx="20"/>
  <text class="lblw" x="115" y="330">Pitch</text>
  <rect class="box in" x="40" y="357" width="150" height="46" rx="20"/>
  <text class="lblw" x="115" y="380">Loudness</text>

  <!-- decoder -->
  <rect class="box dec" x="250" y="247" width="130" height="166" rx="8"/>
  <text class="lbl" x="315" y="330">Decoder</text>
  <path class="wire" d="M190,280 L248,300"/>
  <path class="wire" d="M190,330 L248,330"/>
  <path class="wire" d="M190,380 L248,360"/>

  <!-- the rest of the model, drawn in full in Part 2 -->
  <rect class="box syn" x="470" y="285" width="560" height="90" rx="4"/>
  <text class="lbl" x="750" y="317">Synthesis as in Part 2</text>
  <text class="small" x="750" y="346">masks, harmonic synth, body filter, filtered noise, room reverb</text>
  <path class="wire" d="M380,330 L468,330"/>
  <path class="wire" d="M1030,330 L1230,330 L1230,152"/>
</svg>
